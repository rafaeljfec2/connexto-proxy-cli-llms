services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "24.22.1"
    image: agent-runtime-gateway:local
    ports:
      - 9090:9090
    env_file:
      - path: .env
        required: true
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
      LOG_FORMAT: json
      LOG_LEVEL: info
      # Host .env often points at WSL Chrome + headed auth; invalid inside the container.
      CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
      CHROMIUM_NO_SANDBOX: "true"
      CURSOR_USAGE_AUTH_HEADLESS: "true"
      HOME: /var/lib/connexto-proxy/gateway-home
      CURSOR_USAGE_AUTH_USER_DATA_DIR: /var/lib/connexto-proxy/cursor-usage-auth
      CURSOR_USAGE_INTERACTION_URL_BASE: http://127.0.0.1:9090
      # Local Docker default when .env leaves GATEWAY_API_TOKEN empty. Override in .env for real deployments.
      GATEWAY_API_TOKEN: ${GATEWAY_API_TOKEN:-docker-local-gateway-dev}
      GATEWAY_JSON_BODY_LIMIT_BYTES: ${GATEWAY_JSON_BODY_LIMIT_BYTES:-33554432}
      CURSOR_DEFAULT_WORKING_DIRECTORY: /workspace
      SESSION_STORAGE_DRIVER: ${SESSION_STORAGE_DRIVER:-filesystem}
      SESSION_STORAGE_PATH: ${SESSION_STORAGE_PATH:-/var/lib/connexto-proxy/sessions}
      AGY_PATH: /app/.gemini/bin/agy
      ANTIGRAVITY_STORAGE_PATH: ${ANTIGRAVITY_STORAGE_PATH:-/app}
      PATH: /app/.gemini/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      # Dev default: one repo at /workspace (direct clients + CURSOR_DEFAULT_WORKING_DIRECTORY).
      # AI Hub + Codex resolve workspace only from the request payload (absolute host paths in <cwd>/<root>).
      # Those paths must exist inside the container: bind the host tree at the SAME absolute paths
      # (e.g. /home/rafael:/home/rafael:rw), not only as /workspace or /projects. Or run `pnpm dev` on the host.
      - ${CURSOR_WORKSPACE_HOST_PATH:-../connexto-aihub}:/workspace:rw
      - proxy-sessions:/var/lib/connexto-proxy/sessions:rw
      # Provider host authentication mount points (preserves Google / Antigravity OAuth tokens and CLI settings across recreations)
      - ${HOST_GEMINI_DIR:-${HOME}/.gemini}:/app/.gemini:rw
      - ${HOST_ANTIGRAVITY_CONFIG_DIR:-${HOME}/.config/antigravity}:/app/.config/antigravity:rw
    # Match the WSL/Linux host uid so the agent can write under the bind-mounted workspace.
    user: ${CURSOR_CONTAINER_USER:-1000:1000}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  proxy-sessions:
